name: Build, Test, Coverage, and Publish

on:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
  pull_request:
    branches: [ main ]
    paths:
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      skip_check:
        description: 'Set to "true" to skip the version check and force the build_and_test job'
        required: false
        default: 'false'

jobs:
  check_version:
    name: Check if version has changed
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version has changed
        id: version_check
        env:
          SKIP_CHECK: ${{ github.event.inputs.skip_check }}
        run: |
          # If manually triggered with skip_check=true, short-circuit and force a build
          if [ "${SKIP_CHECK:-false}" = "true" ]; then
            echo "Manual run requested: skipping version check and forcing build."
            # set step output `version_changed=true` so the job output propagates
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # --- original version-check logic follows ---
          # Fetch the previous commit history
          git fetch --depth=2

          # Get the latest commit hash (HEAD) and the second-to-latest commit hash
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)

          # If HEAD^ is not valid, use merge-base to get the common ancestor commit
          if [ $? -ne 0 ]; then
            PREVIOUS_COMMIT=$(git merge-base HEAD HEAD~1)
          fi

          # Check if pyproject.toml has changed and if the version field has changed
          VERSION_CHANGED=$(git diff --name-only $PREVIOUS_COMMIT HEAD | grep -E '^pyproject.toml$' && git diff -U0 $PREVIOUS_COMMIT HEAD pyproject.toml | grep -E '^\+version =')

          if [ -z "$VERSION_CHANGED" ]; then
            echo "Version not changed. Skipping build."
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Version has changed."
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

  build_and_test:
    name: Build & Test on ${{ matrix.os_name }}
    runs-on: ${{ matrix.runs_on }}
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'

    # We run one job per OS and let cibuildwheel build the relevant Python versions
    # (cibuildwheel autodetects supported Python versions from your environment/pyproject).
    strategy:
      matrix:
        include:
          - os_name: linux
            runs_on: ubuntu-latest
            cibw_platform: linux
            cibw_archs: "x86_64 aarch64 ppc64le s390x"
            # manylinux image used for x86_64 by default; you can change to manylinux_2_28 or manylinux2014
            CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

          - os_name: macos
            runs_on: macos-latest
            cibw_platform: macos
            cibw_archs: "x86_64 arm64"

          - os_name: windows
            runs_on: windows-latest
            cibw_platform: windows
            cibw_archs: "AMD64 ARM64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install a host Python for running the cibuildwheel action; cibuildwheel itself will
      # drive the build across the target Python versions.
      - name: Set up Python (host for cibuildwheel)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build prerequisites
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cibuildwheel pytest

      - name: Build wheels (cibuildwheel)
        run: |
          python -m cibuildwheel --output-dir dist --platform ${{ matrix.cibw_platform }}
        env:
          # Build the architectures we want (linux: x86_64, aarch64, ppc64le, s390x)
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # override manylinux image if you need a specific glibc base
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.CIBW_MANYLINUX_X86_64_IMAGE || '' }}
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # Run tests against the built wheel (cibuildwheel will substitute {project} and {pytest} tokens)
          CIBW_TEST_COMMAND: "python -m pytest -q {project}/tests"
          # skip PyPy / musllinux variations we don't want
          CIBW_SKIP: "pp* *-musllinux*"
          CIBW_TEST_REQUIRES: pytest

      - name: Upload Wheel to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os_name }}
          path: dist/*.whl
          retention-days: 1

  publish:
    name: Publish (combine artifacts, test & publish)
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Wheels
        uses: actions/download-artifact@v4
        with:
          name: python-wheels-linux
          path: dist/linux/

      - name: Download macOS Wheels
        uses: actions/download-artifact@v4
        with:
          name: python-wheels-macos
          path: dist/macos/

      - name: Download Windows Wheels
        uses: actions/download-artifact@v4
        with:
          name: python-wheels-windows
          path: dist/windows/

      - name: Combine Artifacts
        run: |
          mkdir -p dist/combined
          cp dist/linux/*.whl dist/combined/ || true
          cp dist/macos/*.whl dist/combined/ || true
          cp dist/windows/*.whl dist/combined/ || true

      - name: Install test tools
        run: pip install pytest pytest-cov codecov

      - name: Install built wheel
        run: pip install --no-index --find-links=dist/combined multi-choices-parser

      - name: Run tests with coverage
        run: pytest --cov=multi_choices_parser --cov-report=xml

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages_dir: dist/combined
          skip-existing: true
