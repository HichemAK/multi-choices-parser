name: Build, Test, Coverage, and Publish

on:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
  pull_request:
    branches: [ main ]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  check_version:
    name: Check if version has changed
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version has changed
        id: version_check
        run: |
          # Fetch the previous commit history
          git fetch --depth=2

          # Get the latest commit hash (HEAD) and the second-to-latest commit hash
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          
          # If HEAD^ is not valid, use merge-base to get the common ancestor commit
          if [ $? -ne 0 ]; then
            PREVIOUS_COMMIT=$(git merge-base HEAD HEAD~1)
          fi

          # Check if pyproject.toml has changed and if the version field has changed
          VERSION_CHANGED=$(git diff --name-only $PREVIOUS_COMMIT HEAD | grep -E '^pyproject.toml$' && git diff -U0 $PREVIOUS_COMMIT HEAD pyproject.toml | grep -E '^\+version =')
          
          if [ -z "$VERSION_CHANGED" ]; then
            echo "Version not changed. Skipping build."
            echo "::set-output name=version_changed::false"
            exit 0
          else
            echo "Version has changed."
            echo "::set-output name=version_changed::true"
          fi

  build_and_test:
    name: Build & Test on ${{ matrix.platform[0] }}
    runs-on: ${{ matrix.platform[1] }}
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'

    strategy:
      matrix:
        platform: [[linux, ubuntu-latest], [macos, macos-latest], [windows, windows-latest]]
        # platform: [[linux, ubuntu-latest]]
        # python-version: [3.8, 3.9, 3.10, 3.11, 3.12, 3.13]  # Modify as needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install cibuildwheel pytest pytest-cov codecov

      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir dist --platform ${{ matrix.platform[0] }} --arch auto64
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_TEST_COMMAND: "python -m pytest {project}/tests"
          CIBW_SKIP: pp*
          CIBW_TEST_REQUIRES: pytest


      - name: Install built wheel
        run: pip install --no-index --find-links=dist multi-choices-parser

      - name: Run tests with coverage
        run: pytest --cov=multi_choices_parser --cov-report=xml

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
