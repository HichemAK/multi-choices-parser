[project]
name = "multi-choices-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hichem Ammar Khodja", email = "hichem.ammarkhodja@orange.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
multi-choices-parser = "multi_choices_parser:main"

[tool.maturin]
module-name = "multi_choices_parser._core"
python-packages = ["multi_choices_parser"]
python-source = "src"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]
